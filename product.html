<!DOCTYPE html>
<html lang="en">
<head>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>VENDOR.COM- Products</title>
    <link rel="icon" href="Screenshot 2025-06-22 at 9.49.20 PM.png "type="image/png"> 
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }
    nav {
      background-color: #4CAF50;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
    }
    nav ul {
      list-style-type: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .product-card {
      background-color: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;

    }
    .product-card img {
      width: 100%;
      border-radius: 8px;
      max-height: 200px;
      object-fit: cover;
    }
    .product-card button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    footer {
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<nav>
  <div class="logo"><strong>VENDOR.Com</strong></div>
  <ul>
    <li><a href="Project.html">Home</a></li>
    <li><a href="products.html">Menu</a></li>
    <li><a href="#">Categories</a></li>
    <li><a href="#">Cart</a></li>
    <li><a href="#">Orders</a></li>
  </ul>
</nav>

<section class="products">

  <div class="product-card">
    <img src="Screenshot 2025-06-26 at 10.29.23 PM.png" alt="Tomatoes">
    <h3>Organic Tomatoes</h3>
    <p>Price: ₹50/kg</p>
    <button>Buy Now</button>
  </div>

  <div class="product-card">
    <img src="/Users/msc/Desktop/html classwork programs/Screenshot 2025-06-26 at 10.32.39 PM.png" alt="Carrots">
    <h3>Fresh Carrots</h3>
    <p>Price: ₹40/kg</p>
    <button>Buy Now</button>
  </div>

  <div class="product-card">
    <img src="Screenshot 2025-06-26 at 10.37.47 PM.png "alt="Rice">
    <h3>Organic Rice</h3>
    <p>Price: ₹80/kg</p>
    <button>Buy Now</button>
  </div>

</section>

<footer>
  <p>Contact us: vendorfarmers@gmail.com | Phone: 1234567890</p>
</footer>
<script src="bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
