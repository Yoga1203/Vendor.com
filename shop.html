<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VENDOR.COM – Shop</title>
  <link rel="icon" href="https://i.ibb.co/99BQDk4r/v-leaf-logo.jpg" type="image/jpeg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2e7d32;
      --accent: #66bb6a;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
    }
    .navbar { background: var(--primary) !important; }
    .product-card {
      transition: all 0.3s;
      border: none;
      border-radius: 16px;
      overflow: hidden;
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.12);
    }
    .product-card img {
      height: 220px;
      object-fit: cover;
    }
    .price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
    }
  </style>
</head>
<body>

<!-- Navbar (Same as your homepage) -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center text-white fw-bold" href="Project.html">
      <img src="https://i.ibb.co/99BQDk4r/v-leaf-logo.jpg" width="40" height="40" class="me-2 rounded-circle">
      VENDOR.COM
    </a>
    <a href="Project.html" class="btn btn-light btn-sm">← Back to Home</a>
  </div>
</nav>

<div class="container pt-5 mt-5">
  <h2 class="text-center mb-5 fw-bold">All Fresh Products</h2>

  <div class="row g-4">
    <!-- Product 1 -->
    <div class="col-md-4 col-sm-6">
      <div class="product-card card h-100">
        <img src="https://images.unsplash.com/photo-1618864138281-02a9fb66deb7" class="card-img-top" alt="Cherry Tomatoes">
        <div class="card-body">
          <h5 class="card-title">Cherry Tomatoes</h5>
          <p class="text-muted small">Organic • 500g</p>
          <div class="d-flex justify-content-between align-items-center">
            <span class="price">₹89</span>
            <button class="btn btn-success btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Product 2 -->
    <div class="col-md-4 col-sm-6">
      <div class="product-card card h-100">
        <img src="https://images.unsplash.com/photo-1439127989242-c3749a012eac" class="card-img-top" alt="Red Apples">
        <div class="card-body">
          <h5 class="card-title">Red Apples</h5>
          <p class="text-muted small">Fresh • 1 kg</p>
          <div class="d-flex justify-content-between align-items-center">
            <span class="price">₹149</span>
            <button class="btn btn-success btn-sm">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add more products as needed -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
