<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Card</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .custom-card {
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .custom-card:hover {
      transform: translateY(-5px);
    }

    .btn-read-more {
      background-color: #007bff;
      color: white;
      transition: background-color 0.3s ease;
    }

    .btn-read-more:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card custom-card">
          <img src="https://via.placeholder.com/600x300" class="card-img-top" alt="Blog Image">
          <div class="card-body">
            <h5 class="card-title">Blog Post Title</h5>
            <p class="card-text">This is a short excerpt from the blog post. It gives a brief overview of the content to entice the reader.</p>
            <a href="#" class="btn btn-read-more">Read More</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (optional, for interactivity if needed) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
