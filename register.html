<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VENDOR.COM – Register</title>
  <link rel="icon" href="https://i.ibb.co/99BQDk4r/v-leaf-logo.jpg" type="image/jpeg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2e7d32;
      --accent: #66bb6a;
      --light: #e8f5e9;
    }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding-top: 80px;
      
      /* Beautiful Background Image */
      background-image: url('https://images.unsplash.com/photo-1499529112087-3cb3b73cec95?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTh8fGFncmljdWx0dXJlfGVufDB8fDB8fHww');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      
      /* Dark overlay for better text readability */
      position: relative;
    }

    /* Overlay */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.38);
      z-index: -1;
    }

    .navbar { 
      background: var(--primary) !important; 
      box-shadow: 0 2px 8px rgba(0,0,0,.15); 
    }
    .navbar .nav-link { 
      color: #fff !important; 
      font-weight: 500; 
    }

    .glass-form {
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 40px;
      max-width: 460px;
      width: 100%;
      margin: 40px auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.6);
    }

    /* Role Cards */
    .role-selection {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    .role-card {
      border: 2px solid #ddd;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      width: 100%;
      max-width: 180px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: white;
    }
    .role-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(102,187,106,0.2);
    }
    .role-card.active {
      border-color: var(--accent);
      background: rgba(102,187,106,0.1);
      box-shadow: 0 0 0 4px rgba(102,187,106,0.3);
    }
    .role-card i {
      font-size: 2.8rem;
      margin-bottom: 12px;
      display: block;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-weight: 600;
      width: 100%;
      transition: all 0.3s;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(46,125,50,0.4);
    }

    .password-wrapper { position: relative; }
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
    }
    .strength-meter {
      height: 4px;
      margin-top: 6px;
      border-radius: 4px;
      transition: all 0.3s;
    }
    .match-message { 
      font-size: 0.85rem; 
      margin-top: 5px; 
    }
    .match-message.good { color: #2e7d32; }
    .match-message.bad { color: #d32f2f; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center text-white fw-bold" href="Project.html">
      <img src="https://i.ibb.co/99BQDk4r/v-leaf-logo.jpg" alt="VENDOR.COM" width="40" height="40" class="me-2 rounded-circle">
      VENDOR.COM
    </a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="Project.html">Back to Home</a></li>
    </ul>
  </div>
</nav>

<div class="container">
  <div class="glass-form">
    <div class="text-center mb-4">
      <img src="https://i.ibb.co/99BQDk4r/v-leaf-logo.jpg" alt="Logo" style="width:80px;height:80px;">
      <h2 class="text-dark">Join VENDOR.COM</h2>
      <p class="text-muted">Sell or buy fresh farm products directly</p>
    </div>

    <!-- Role Selection -->
    <div class="role-selection">
      <div class="role-card active" id="roleBuyer" data-role="buyer">
        <i class="bi bi-basket3-fill text-success"></i>
        <div class="fw-bold">I'm a Buyer</div>
        <small class="text-muted">Shop fresh produce</small>
      </div>

      <div class="role-card" id="roleSeller" data-role="seller">
        <i class="bi bi-shop-window text-success"></i>
        <div class="fw-bold">I'm a Seller</div>
        <small class="text-muted">List your harvest</small>
      </div>
    </div>

    <form id="registerForm" novalidate>
      <input type="hidden" id="userRole" value="buyer">

      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <div class="input-group">
          <span class="input-group-text" id="phonePrefix">+91</span>
          <input type="tel" class="form-control" id="phone" placeholder="9876543210" maxlength="15" required>
        </div>
      </div>

      <button type="button" id="sendOtpBtn" class="btn btn-outline-success mb-3 w-100">Send OTP</button>

      <div id="otpSection" class="mb-3" style="display: none;">
        <label class="form-label">OTP (6 digits)</label>
        <input type="text" class="form-control" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
        <button type="button" id="verifyOtpBtn" class="btn btn-outline-success mt-2 w-100">Verify OTP</button>
      </div>

      <div class="mb-3">
        <label class="form-label">Country</label>
        <select class="form-select" id="country" required>
          <option value="IN" data-code="+91" selected>India (+91)</option>
        </select>
      </div>

      <div class="mb-3 password-wrapper">
        <label class="form-label">Create Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="Minimum 8 characters" required>
          <button type="button" class="password-toggle" id="togglePassword"><i class="bi bi-eye-slash"></i></button>
        </div>
        <div id="strengthMeter" class="strength-meter"></div>
      </div>

      <div class="mb-4 password-wrapper">
        <label class="form-label">Confirm Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required>
          <button type="button" class="password-toggle" id="toggleConfirm"><i class="bi bi-eye-slash"></i></button>
        </div>
        <div id="matchMessage" class="match-message"></div>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="terms" required>
        <label class="form-check-label small" for="terms">
          I agree to the <a href="#" class="text-success">Terms & Conditions</a> and <a href="#" class="text-success">Privacy Policy</a>
        </label>
      </div>

      <div id="formAlert"></div>

      <button type="submit" class="btn btn-submit" disabled>Create Account</button>

      <div class="text-center mt-4 small text-muted">
        Already have an account? <a href="login.html" class="text-success fw-medium">Log in</a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Role Selection
document.querySelectorAll('.role-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    document.getElementById('userRole').value = card.dataset.role;
  });
});

// Password Toggles
function setupToggle(inputId, toggleId) {
  document.getElementById(toggleId).addEventListener('click', function() {
    const input = document.getElementById(inputId);
    input.type = input.type === 'password' ? 'text' : 'password';
    this.querySelector('i').className = input.type === 'password' ? 'bi bi-eye-slash' : 'bi bi-eye';
  });
}
setupToggle('password', 'togglePassword');
setupToggle('confirmPassword', 'toggleConfirm');

// Password Strength Meter
document.getElementById('password').addEventListener('input', function() {
  const val = this.value;
  let strength = 0;
  if (val.length >= 8) strength++;
  if (val.match(/[A-Z]/)) strength++;
  if (val.match(/[0-9]/)) strength++;
  if (val.match(/[^A-Za-z0-9]/)) strength++;

  const meter = document.getElementById('strengthMeter');
  meter.className = 'strength-meter';
  
  if (strength === 0) meter.style.width = '0%';
  else if (strength <= 2) {
    meter.classList.add('bg-danger');
    meter.style.width = '33%';
  } else if (strength === 3) {
    meter.classList.add('bg-warning');
    meter.style.width = '66%';
  } else {
    meter.classList.add('bg-success');
    meter.style.width = '100%';
  }
});

// Password Match Check
document.getElementById('confirmPassword').addEventListener('input', function() {
  const pw = document.getElementById('password').value;
  const msg = document.getElementById('matchMessage');
  
  if (this.value === '') {
    msg.textContent = '';
  } else if (pw === this.value) {
    msg.textContent = 'Passwords match ✓';
    msg.className = 'match-message good';
  } else {
    msg.textContent = 'Passwords do not match ✗';
    msg.className = 'match-message bad';
  }
});

// OTP Simulation
let generatedOtp = null;
document.getElementById('sendOtpBtn').addEventListener('click', () => {
  const phone = document.getElementById('phone').value.trim();
  if (!phone || phone.length < 8) {
    showAlert('Please enter a valid phone number', 'danger');
    return;
  }
  generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
  console.log(`OTP for ${document.getElementById('phonePrefix').textContent}${phone}: ${generatedOtp}`);
  
  document.getElementById('otpSection').style.display = 'block';
  showAlert('OTP sent successfully! (Check console for code)', 'success');
});

document.getElementById('verifyOtpBtn').addEventListener('click', () => {
  const entered = document.getElementById('otp').value.trim();
  if (entered === generatedOtp) {
    showAlert('Phone verified successfully!', 'success');
    document.querySelector('.btn-submit').disabled = false;
  } else {
    showAlert('Incorrect OTP. Please try again.', 'danger');
  }
});

// Form Submission
document.getElementById('registerForm').addEventListener('submit', function(e) {
  e.preventDefault();
  if (this.querySelector('.btn-submit').disabled) {
    showAlert('Please verify OTP first', 'danger');
    return;
  }
  const name = document.getElementById('name').value.trim();
  showAlert(`Account created successfully for ${name}! 🌿`, 'success');
  
  setTimeout(() => {
    window.location.href = 'Project.html';
  }, 2200);
});

function showAlert(msg, type) {
  const div = document.getElementById('formAlert');
  div.innerHTML = `
    <div class="alert alert-${type} alert-dismissible fade show">
      ${msg}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>`;
}
</script>
</body>
</html>
