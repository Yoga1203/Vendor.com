<!DOCTYPE html>
<html>
    <head>
        <title>user personal information</title>
        <style>
            form{
                border :2px dotted black;
                padding: 20px;
      width: 300px;
      margin: 20px auto;
            }
        </style>
    </head>
    <body>
        <h2 style="text-align: center;">User Personal Information</h2>
        
            <form>
                <label>Enter your full name:</label><br>
                <input type="text" name="fullname" ><br><br>
            
                <label>Enter your email:</label><br>
                <input type="email" name="email"><br><br>
            
                <label>Enter your password:</label><br>
                <input type="password"><br><br>
            
                <label>Confirm your password:</label><br>
                <input type="password" name="confirm password"><br><br>
            
                <label>Enter your gender:</label><br>
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
                <input type="radio" name="gender"> Others<br><br>
            
                <label>Enter your Date of Birth:</label><br>
                <input type="date" name="dob"><br><br>
            
                <label>Enter your Address:</label><br>
                <textarea name="address" rows="2" cols="30">Noida Sector 137</textarea><br><br>
            
                <input type="submit">
            </form>
    </body>
</html>
