<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VENDOR.COM – Login</title>
  <link rel="icon" href="https://i.ibb.co/99BQDk4r/v-leaf-logo.jpg" type="image/jpeg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2e7d32;
      --accent: #66bb6a;
      --light: #e8f5e9;
    }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding-top: 80px;
      
      /* Same Background Image as Register Page */
      background-image: url('https://plus.unsplash.com/premium_photo-1663945779302-b46b12b6d811?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MzN8fGFncmljdWx0dXJlfGVufDB8fDB8fHww');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      
      /* Dark overlay for readability */
      position: relative;
    }

    /* Overlay */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.38);
      z-index: -1;
    }

    .navbar { 
      background: var(--primary) !important; 
      box-shadow: 0 2px 8px rgba(0,0,0,.15); 
    }
    .navbar .nav-link { 
      color: #fff !important; 
      font-weight: 500; 
    }

    .glass-form {
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 40px;
      max-width: 460px;
      width: 100%;
      margin: 40px auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.6);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-weight: 600;
      width: 100%;
      transition: all 0.3s;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(46,125,50,0.4);
    }

    .password-wrapper { position: relative; }
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
    }

    .social-btn {
      border-radius: 50px;
      font-weight: 500;
      padding: 12px;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center text-white fw-bold" href="Project.html">
      <img src="https://i.ibb.co/99BQDk4r/v-leaf-logo.jpg" alt="VENDOR.COM" width="40" height="40" class="me-2 rounded-circle">
      VENDOR.COM
    </a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="Project.html">Back to Home</a></li>
    </ul>
  </div>
</nav>

<div class="container">
  <div class="glass-form">
    <div class="text-center mb-4">
      <img src="https://i.ibb.co/99BQDk4r/v-leaf-logo.jpg" alt="Logo" style="width:80px;height:80px;">
      <h2 class="text-dark">Welcome Back</h2>
      <p class="text-muted">Login to VENDOR.COM</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Email or Phone Number</label>
        <input type="text" class="form-control" id="loginIdentifier" 
               placeholder="Enter email or phone" required>
      </div>

      <div class="mb-4 password-wrapper">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="loginPassword" 
                 placeholder="Enter your password" required>
          <button type="button" class="password-toggle" id="toggleLoginPassword">
            <i class="bi bi-eye-slash"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label small" for="rememberMe">Remember me</label>
        </div>
        <a href="#" class="text-success small fw-medium">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-submit">Login</button>

      <!-- Social Login -->
      <div class="text-center my-4">
        <small class="text-muted">Or continue with</small>
      </div>

      <div class="d-grid gap-2 mb-4">
        <button type="button" class="btn btn-light border social-btn">
          <i class="bi bi-google me-2"></i> Continue with Google
        </button>
        <button type="button" class="btn btn-dark social-btn">
          <i class="bi bi-apple me-2"></i> Continue with Apple
        </button>
      </div>

      <div class="text-center small text-muted">
        Don't have an account? 
        <a href="register.html" class="text-success fw-medium">Create New Account</a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Password Toggle
document.getElementById('toggleLoginPassword').addEventListener('click', function() {
  const pw = document.getElementById('loginPassword');
  const icon = this.querySelector('i');
  
  if (pw.type === 'password') {
    pw.type = 'text';
    icon.className = 'bi bi-eye';
  } else {
    pw.type = 'password';
    icon.className = 'bi bi-eye-slash';
  }
});

// Login Form Submission (Demo)
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const identifier = document.getElementById('loginIdentifier').value.trim();
  
  if (!identifier) {
    showAlert('Please enter your email or phone number', 'danger');
    return;
  }

  showAlert('Login successful! Redirecting... 🌿', 'success');

  setTimeout(() => {
    window.location.href = 'Project.html';   // Change to your dashboard later
  }, 1800);
});

function showAlert(msg, type) {
  // Create temporary alert
  const alertDiv = document.createElement('div');
  alertDiv.className = `alert alert-${type} alert-dismissible fade show mt-3`;
  alertDiv.innerHTML = `
    ${msg}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  `;
  document.getElementById('loginForm').appendChild(alertDiv);

  // Auto remove after 4 seconds
  setTimeout(() => {
    if (alertDiv.parentNode) alertDiv.parentNode.removeChild(alertDiv);
  }, 4000);
}
</script>
</body>
</html>
